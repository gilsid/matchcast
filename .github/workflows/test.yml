name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      DATABASE_URL_UNPOOLED: "postgresql://test:test@localhost:5432/test"
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test
      AUTH_RATE_LIMIT: "100"
      CORS_ORIGIN: "http://localhost:5173"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: matchcast-backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install

      - run: bunx prisma generate

      - run: bunx prisma migrate deploy

      - run: bun run typecheck

      - run: bun run test:unit

      - run: bun run test

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    defaults:
      run:
        working-directory: matchcast-frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install

      - run: bunx svelte-kit sync

      - run: bun run build

      - run: bun run check

      - run: bun run test:unit
        env:
          VITE_API_URL: http://localhost:3001
